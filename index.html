Bt({id:'a2_back',act:2,day:DAY(1960,10,2),hook:'boss',t:()=>'The morning after Lagos. Report to '+RL().boss,gap:'The night train rattles home. Ibadan wakes to its first morning as a free country.',go(){const r=RL(),e=S.end;const L={Hidden:'"Back from the celebrations, clerk? Good. Nothing out of the ordinary, I hope?" His eyes rest on you a moment too long.',Watched:'"Late, clerk. Lagos is tiring, I hear. Sit. Work."',Hunted:'He glances at your bruises and says nothing for a long time. "Be careful where you walk, clerk."',Exposed:'"A headline in the Pilot today," he says quietly, not looking up. "Interesting reading." You say nothing.','Hidden, alone':'"No friends in Lagos, clerk? Better so. Friends are dangerous."'}[e]||'"Good morning, clerk."';seq([[r.boss,L],['Narrator','The portrait of the Queen has gone from the wall. In its place hangs a pale rectangle, and a new one of the Prime Minister.']],()=>{fin('a2_back');S.sh0=S.sh})}});

Bt({id:'a3_papers',act:3,day:DAY(1963,9,11),hook:'paper',t:()=>'Read the three papers on the verdict ('+(F().np||0)+'/3)',gap:'August into September: the fight is remembered, the weather turns, the papers sharpen their pens.',go(){const k=F().np||0,P=[['Daily Times','"Awolowo found guilty of treason felony. The court sentences him to ten years in prison, 11 September 1963." Dry, official, quiet.'],['West African Pilot','"A political verdict, say the Opposition. A crime against democracy." It reads like a trumpet.'],['Nigerian Tribune','"The West mourns." A black border around the front page. It reads like a funeral bell.']];dlg('Kunle the newsboy','"Three papers, three stories, sir! Buy and judge for yourself."',P.map((p,i)=>[p[0]+' ('+D(4)+')'+(F()['rd'+i]?' ✓':''),()=>{if(F()['rd'+i])return say(p[0],'You already read it.');if(S.cash<4)return say('Kunle','"Small money, sir."');S.cash-=4;F()['rd'+i]=1;F().np=(F().np||0)+1;say(p[0],p[1],[['OK',()=>{if(F().np>=3){fin('a3_papers','Three papers, three truths. Take it to the compound.');shut()}else shut()},1]])}]).concat([['Walk on',shut]]))}});
Bt({id:'a3_comp',act:3,day:DAY(1963,9,11),town:'ibadan',pos:[-112,5.6],name:'The compound: neighbours',t:'Go to the compound: the neighbours are arguing about the verdict',go(){seq([['Mama Tope','"Ten years! They are punishing him because he is clever."'],['Baba Ayo','"He wanted power, not justice. The court did what it must."'],['Iya Sade','"I do not care about any of them. Bread is sixpence and my husband has no work!"']],()=>dlg('The argument','They all turn to you. "You, the clerk! You see the papers. What do you say?"',[['"The court must be respected."',()=>{S.res=(S.res||50)+1;S.stance='order';say('Baba Ayo','"Ha! A sensible young man."');fin('a3_comp')},1],['"He was treated unjustly."',()=>{S.stance='justice';say('Mama Tope','"You have courage, my son. Say it quietly."');fin('a3_comp')}],['"Let us just pray for peace."',()=>{S.stance='peace';say('Iya Sade','"Amen, my child. Amen."');fin('a3_comp')}]]))}});
Bt({id:'a3_rep',act:3,day:DAY(1963,10,1),town:'ibadan',pos:[-150,-52],name:'Republic Day parade at Mapo Hall',t:'Republic Day: join the parade at Mapo Hall',gap:'September.',go(){seq([['Narrator','1 October 1963. Nigeria is no longer a dominion; it is a Republic, with a Nigerian head of state. At Mapo Hall bands play, schoolchildren march, chiefs sit in their finest.'],['Announcer','"Ladies and gentlemen, His Excellency Dr. Nnamdi Azikiwe, first President of the Federal Republic of Nigeria!"']],()=>tapGame('🇳🇬 The parade','Wave your flag with the crowd! Tap!',18,7,ok=>say('Mapo Hall',ok?'You wave until your arm aches. A schoolgirl on her father\'s shoulders sings the anthem and the whole street joins in.':'You stand quietly, flag in hand, listening. It is enough.',[['Continue',()=>{S.fam=(S.fam||50)+1;adv(120);fin('a3_rep');shut()},1]])))}});
Bt({id:'a3_tv',act:3,day:DAY(1963,10,1),hook:'tv',t:'Go home and watch the Republic programme on television with the family',go(){tvOnce();}});
function tvOnce(){TVON=true;seq([['Television','The flickering set shows the swearing-in, the new flag, the President in his white robes.'],['Papa','Papa takes off his cap. "A Republic. I was born a subject. I shall die a citizen."'],['Mama','Mama dabs her eyes with the corner of her wrapper.']],()=>{TVON=false;S.fam=(S.fam||50)+2;fin('a3_tv','A Republic. A family watching together.')})}
Bt({id:'a3_contract',act:3,day:DAY(1963,11,12),hook:'cab',t:'Work: a new Bankole & Sons file has reached the Ministry',gap:'October to November. The Republic settles in; so do old habits.',go(){const r=RL();dlg('📁 New contract','On top of the pile: RING ROAD EXTENSION, £6,800, Bankole & Sons. The same signatures as Ledger 17. The same phrase: "ceremonial repair".',[['Copy it for the file you keep',()=>{S.ev=(S.ev||0)+1;S.dan=(S.dan||0)+1;adv(60);fin('a3_contract','Another page. Another risk.')}],['Pass it on without comment',()=>{adv(10);S.silence=(S.silence||0)+1;fin('a3_contract')},1],['Tell '+r.boss,()=>{S.dan=(S.dan||0)+1;S.reported=1;adv(10);say(r.boss,'"Interesting. You are too curious, '+S.name+'. Curiosity is a luxury of the rich."',[['OK',()=>{fin('a3_contract');shut()},1]])}]])}});
Bt({id:'a3_chidi',act:3,day:DAY(1963,11,12),town:'ibadan',pos:[-10,-6.4],name:'Chidi at the newsstand',t:'Chidi, now a journalist, is waiting at the newsstand',go(){seq([['Chidi','"Eh, my friend! I write for the Pilot now. Listen, the new Ring Road contract: do you have anything? Anything at all?"']],()=>dlg('Chidi','He lowers his voice. "I will protect your name. I swear on my mother."',[['Give him what you copied',()=>{if(!S.ev)return say('You','You have nothing to give. He nods sadly.',[['OK',()=>{fin('a3_chidi');shut()},1]]);S.chidiAlly=Math.max(S.chidiAlly||0,1);S.ev--;S.dan=(S.dan||0)+1;fin('a3_chidi');say('Chidi','"Thank you. This could break the whole thing open."')},1],['Tell him you know nothing',()=>{S.chidiAlly=Math.min(S.chidiAlly||0,0);fin('a3_chidi');say('Chidi','He studies you and says, flatly, "I understand. I will not ask again."')}],['Say it is too dangerous',()=>{fin('a3_chidi');say('Chidi','"Danger is the whole point, friend." But he lets it go.')}]]))}});
Bt({id:'a3_post',act:3,day:DAY(1963,12,12),town:'ibadan',pos:[-75,7.2],name:'Post and Telegraph office',t:'Open a savings account at the Post Office',go(){dlg('Post Office','A clerk behind a brass grille stamps books all day. "Savings, sir? The Post Office pays a little interest every year. Deposit what you can."',[['Deposit '+D(600),()=>{if(S.cash<600)return say('Clerk','"Come when you have saved some."');S.cash-=600;S.bank2=(S.bank2||0)+600;fin('a3_post');say('Clerk','He stamps your new book. "Your first savings. Guard it well."')},1],['Send a telegram to Femi ('+D(24)+')',()=>{if(S.cash<24)return say('Clerk','"Small money."');S.cash-=24;S.fam=(S.fam||50)+1;say('Clerk','"To Private Femi, Kaduna: ALL WELL AT HOME STOP MAMA PRAYING STOP." It goes out on the wire.')}],['Leave',shut]])}});
/* ACT 4: The Strike */
Bt({id:'a4_prices',act:4,day:DAY(1964,3,16),hook:'market',t:'Go to Dugbe Market: the prices are rising again',gap:'The new year, then the dry months. Bread inches up, then lurches.',go(){seq([['Iya Ejo','"Bread was sixpence last year. Now it is ninepence! Rice has doubled! How shall the clerk\'s wife live?" She waves her ladle at you.'],['Narrator','All around the stalls, women argue prices with more heat than manners. A porter spits and mutters about wages.']],()=>dlg('Iya Ejo','"Your money, clerk. Buy now or buy dearer tomorrow."',[['Buy provisions for the family ('+D(120)+')',()=>{if(S.cash<120)return say('Iya Ejo','"Not enough, ah-ah."');S.cash-=120;S.fam=(S.fam||50)+2;S.hun=Math.min(100,S.hun+15);fin('a4_prices');say('Iya Ejo','She loads your basket. "Tell your Ministry people we are suffering."')},1],['Just listen to the market talk',()=>{adv(30);fin('a4_prices')}]]))}});
Bt({id:'a4_union',act:4,day:DAY(1964,5,25),hook:'boss',t:'Lunchtime union meeting at the Ministry: hear the speaker',gap:'April into May. The workers\' mood sours.',go(){if(S.min<720)return dlg(RL().boss,'"The meeting is at midday."',[['⏳ Wait until noon',()=>{waitTo(12);shut()},1],['Leave',shut]]);seq([['Union man','A man stands on a crate in the yard. "Brothers! The cost of living has doubled and our pay has not! The Joint Action Committee calls a general strike from the first of June!"'],['Colleague','Mr. Bamgbose nudges you: "If you join, the Ministry will not pay you. If you do not, we shall remember."']],()=>{S.f.knowStrike=1;fin('a4_union','The strike is called for 1 June. Decide on the day.')})}});
Bt({id:'a4_strike',act:4,day:DAY(1964,6,1),town:'ibadan',pos:[-44,-8.8],name:'The Ministry gate (picket)',t:'1 June 1964: the Ministry gate. Strike or cross the line?',gap:'Last days of May. The newspapers say "Strike". The Ministry corridors say nothing.',go(){seq([['Narrator','Monday, 1 June 1964. At the Ministry gate, hundreds of workers in their office clothes stand shoulder to shoulder. Placards. Drums. A tired policeman leans on his bicycle.']],()=>dlg('The picket line','A man at the gate holds out a placard. Behind him the doors are open, and your desk waits.',[['Join the strike (lose pay, gain trust)',()=>{S.strikeChoice='strike';tapGame('✊ The picket','Chant with your colleagues! Tap!',18,7,ok=>{S.res=(S.res||50)+3;S.aut=(S.aut||50)-3;fin('a4_strike');say('Picket line','Your voice cracks but you do not stop. For the first time you feel that thousands of clerks, porters and dockers are one voice.',[['Keep marching',shut,1]])})},1],['Cross the line and work',()=>{S.strikeChoice='cross';S.res=(S.res||50)-3;S.aut=(S.aut||50)+3;fin('a4_strike');say('Narrator','Someone spits near your shoes. A colleague whispers "Scab." You walk through into an empty building. Mr. Ogunleye nods at you, pleased.',[['Go to your desk',shut,1]])}]]))}});
Bt({id:'a4_march',act:4,day:DAY(1964,6,3),town:'ibadan',pos:[-150,-52],name:'Strikers\' rally at Mapo Hall',t:'Join the march to the rally at Mapo Hall',skip:()=>S.strikeChoice!=='strike',gap:'The strike days.',go(){seq([['Narrator','Thousands march from the Ministry to Mapo Hall, singing. The shops close. Even the motor park is silent. A man on a lorry shouts, and the crowd shouts back.'],['Union man','"We built this nation with our hands! Let the government see how it runs without us!"']],()=>{adv(240);S.hun=Math.max(0,S.hun-20);fin('a4_march','The march is over. Now the waiting.')})}});
Bt({id:'a4_settle',act:4,day:DAY(1964,6,14),hook:'paper',t:'Buy a paper: has the strike ended?',gap:'Two weeks. Offices dark, ports idle, the whole country holding its breath.',go(){dlg('Kunle the newsboy','"The strike is over, sir! Over!"',[['Buy the Daily Times ('+D(6)+')',()=>{if(S.cash<6)return say('Kunle','"Small money."');S.cash-=6;S.raise=1;seq([['Daily Times','"The general strike, begun on 1 June after the Morgan Commission report, ends after about two weeks with a promise of higher wages."'],['Narrator',S.strikeChoice==='strike'?'Your colleagues clap your shoulder. "You stood with us." The raise comes, and so does a hard-won respect.':'The raise comes for everyone. Your colleagues are courteous but cool for months.']],()=>fin('a4_settle'))},1],['Walk on',shut]])}});
Bt({id:'a4_wed',act:4,day:DAY(1964,9,12),town:'ibadan',pos:[-100,9.2],name:'Your wedding',t:'Your wedding day: gather at the compound with your family',gap:'July and August. You are courting '+'someone from the neighbouring street.',go(){const sp=SPNAME();seq([['Narrator','Saturday. The compound is cleaned, benches borrowed, a tarpaulin stretched overhead. Drummers. Cooking pots the size of a man. '+sp+' arrives in a pale wrapper, eyes lowered, followed by her aunts, singing.'],['Papa','Papa, voice shaking: "Today I give my son a wife and my house a daughter."'],['Mama','Mama dances. She has not danced since independence.']],()=>dlg('The wedding','How grand shall the wedding be?',[['A simple ceremony ('+D(960)+')',()=>{if(S.cash<960)return say('You','You do not have enough.');S.cash-=960;S.wed='simple';S.fam=(S.fam||50)+3;fin('a4_wed');say(sp,'"I do not need a feast. I need you."')},1],['A grand wedding with a band ('+D(2400)+')',()=>{if(S.cash<2400)return say('You','You cannot afford that.');S.cash-=2400;S.wed='grand';S.fam=(S.fam||50)+5;S.res=(S.res||50)+2;fin('a4_wed');say(sp,'She laughs, shyly, as the whole street dances at your door.')}]]))}});
Bt({id:'a4_elect',act:4,day:DAY(1964,12,30),town:'ibadan',pos:[18,13.2],name:'Polling station (boycott election)',t:'30 December 1964: the federal election. Go to the polling station',gap:'October to December: speeches, posters, a nation more divided than at Independence.',go(){seq([['Narrator','The polling station is nearly empty. Party posters flap on every wall. Three men in dark glasses stand by the table.'],['Party agent','"Ah, the clerk. Vote early, vote correctly. We shall know. A man should be careful about his house."']],()=>dlg('The ballot box','The agent holds out a ten-shilling note.',[['Vote and take the money',()=>{S.cash+=120;S.bribe=1;S.aut=(S.aut||50)+1;fin('a4_elect');say('Narrator','The coins feel like stones in your pocket.',[['Go',shut,1]])}],['Vote and refuse the money',()=>{S.res=(S.res||50)+2;fin('a4_elect');say('Party agent','"Stubborn." But he writes nothing down. This time.',[['Go',shut,1]])},1],['Walk away and boycott',()=>{S.dan=(S.dan||0)+1;S.boycott=1;fin('a4_elect');say('Narrator','Behind you the agents note who did not come in. Your name is among them.',[['Go',shut,1]])}]]))}});
/* ACT 5: The Wetie */
Bt({id:'a5_cocoa',act:5,day:DAY(1965,7,17),town:'ibadan',pos:[110,-70],name:'Cocoa House',t:'Take the family to see the new Cocoa House',gap:'January 1965: the crisis passes and the Prime Minister is reappointed. In July the Western Region government opens Cocoa House, built from cocoa money.',go(){seq([['Narrator','Cocoa House, finished the year before and now formally opened, rises like a white tower out of the brown rooftops, taller than anything in Ibadan. A lift attendant in a white uniform holds the door.'],['Mama','Mama grips your arm. "My son, if the rope breaks, we die in our best clothes."']],()=>dlg('The lift','The attendant: "Top floor, sir? Sixpence each."',[['Ride to the top ('+D(18)+' for three)',()=>{if(S.cash<18)return say('Attendant','"Small money."');S.cash-=18;fin('a5_cocoa');SKYV.t=9;SKYV.p=[110,76,-84];S.fam=(S.fam||50)+2;busy=false;shut();note('Ibadan spreads below you: a sea of rust-brown roofs to the horizon.')},1],['Look from the foot',()=>{fin('a5_cocoa');say('Papa','"One day, my son, your son will work in a building like this."')}]]))}});
Bt({id:'a5_poll',act:5,day:DAY(1965,10,11),town:'ibadan',pos:[18,13.2],name:'Polling station (Western election)',t:'11 October 1965: the Western Region election. Go to the polling station',gap:'July to October. The West seethes. Everyone is nervous, and no one says why.',go(){seq([['Narrator','A long queue. Party agents with sticks. A lorry of unfamiliar men pulls up; they stand about and stare. A polling officer wipes his forehead and says nothing.'],['Voter','A man whispers: "They already ticked the papers last night. I saw the boxes."']],()=>dlg('The polling station','A thug blocks your way, grinning.',[['Vote anyway, quietly',()=>{S.res=(S.res||50)+1;fin('a5_poll');say('Narrator','Your paper goes into a box you do not trust.',[['Go',shut,1]])},1],['Walk away and go home',()=>{S.dan=(S.dan||0)+1;fin('a5_poll');say('Narrator','You walk away, shoulders tight, feeling eyes on your back.',[['Go',shut,1]])}],['Protest loudly',()=>{S.dan=(S.dan||0)+2;S.res=(S.res||50)+2;fin('a5_poll');say('Narrator','Someone hits you across the shoulder. Someone else drags you away. "Idiot, do you want to die?"',[['Run home',shut,1]])}]]))}});
Bt({id:'a5_fire',act:5,day:DAY(1965,10,15),town:'ibadan',pos:[-112,5.6],name:'Neighbour in danger',t:'Curfew night: a house is burning on your street. Check on Iya Sade',gap:'The days after the vote. Smoke over the city. Cars burn, houses burn. The "wetie": the pouring of petrol.',go(){seq([['Narrator','Night. The sky over the west of the town glows orange. Voices shout. A mob moves along the road with torches, petrol tins and cutlasses. They are going door to door.'],['Iya Sade','Iya Sade appears at the compound gate, trembling. "They are asking whose party we belong to! My husband is out! Please!"']],()=>dlg('Iya Sade','She grabs your sleeve.',[['Bring her into your home',()=>{S.carryN=1;S.hid='hid';fin('a5_fire');shut();note('Walk Iya Sade quickly to your front door.')},1],['Tell her to run to the church',()=>{S.hid='sent';S.fam=(S.fam||50)-1;fin('a5_fire','The mob passes. You do not know what happened to her.');shut()}],['Bolt your own door and stay inside',()=>{S.hid='ignored';S.res=(S.res||50)-3;fin('a5_fire');shut()}]]))}});
Bt({id:'a5_hide',act:5,day:DAY(1965,10,15),hook:'home',t:'Take Iya Sade into your house before the mob arrives',skip:()=>S.hid!=='hid'&&!S.carryN,gap:'',go(){}});
Bt({id:'a5_men',act:5,day:DAY(1965,12,10),hook:'bed',t:'Go to bed: the night after the long rains',skip:()=>!S.ev,gap:'November and December. The ashes cool but the fear does not.',go(){sleepSeq(()=>{S.day=Math.max(S.day,DAY(1965,12,10))+0;S.min=140;newDay();busy=true;seq([['Narrator','A scrape at the gate. Two men in good coats stand in the yard, their driver waiting in a black Mercedes. Bankole\'s men. Papa is already at the door in his sleeping cloth.'],['Man in coat','"We were told the clerk keeps papers that do not belong to him. A small matter. Give them to us and everything is forgotten."']],()=>dlg('At the door','Papa looks at you. Mama is behind him, hands over her mouth.',[['Hand over the pages',()=>{S.ev=0;S.dan=(S.dan||0)-1;S.fam=(S.fam||50)-3;fin('a5_men');say('Man in coat','"A wise man." They leave. Papa will not look at you for a week.')}],['Say you burned them',()=>{S.dan=(S.dan||0)+1;fin('a5_men');say('Man in coat','"We shall see." They search the house for an hour, finding nothing, because you are not a fool. They leave a warning on the table.')}],['Papa: "Get out of my compound!"',()=>{S.dan=(S.dan||0)+1;S.fam=(S.fam||50)+3;fin('a5_men');say('Narrator','Papa stands on his own doorstep, an old man in a sleeping cloth, and does not move. The men look at each other, and go. But they will come back.',[['OK',shut,1]])},1]]))})}});
/* ACT 6: The Knock */
Bt({id:'a6_eve',act:6,day:DAY(1966,1,14),hook:'radio',t:'14 January 1966: go home. Papa wants the news on the radio',gap:'The year turns. Christmas passes quietly. January: the dry, dusty harmattan.',go(){radioOn=false;seq([['Radio','You turn the dial. Music. Static. A hymn. The news hour comes and goes with no news at all.'],['Papa','Papa taps the set. "Strange. At this hour there is always something."'],['Mama','"Maybe the wire is cut." Her voice is too bright.']],()=>{S.f.radioSilent=1;fin('a6_eve')})}});
Bt({id:'a6_rumour',act:6,day:DAY(1966,1,14),town:'ibadan',pos:[-112,5.6],name:'The compound: the evening talk',t:'Go to the compound: the neighbours are whispering',go(){seq([['Mama Tope','"My cousin at the barracks says soldiers are moving tonight. Many lorries."'],['Baba Ayo','"Soldiers always move. It is a barracks, not a church."'],['Iya Sade','"Hush! The air feels wrong. I feel it in my knees."']],()=>{adv(40);fin('a6_rumour')})}});
Bt({id:'a6_knock',act:6,day:DAY(1966,1,14),hook:'bed',t:'Go to bed on the night of 14 to 15 January',go(){sleepSeq(()=>{S.day=DAY(1966,1,15);S.min=90;newDay();knock()})}});
function knock(){busy=true;seq([['Narrator','A hard knock at the door. Three times, then a fourth. Papa is already awake; Mama stands behind him, clutching her wrapper.'],['Narrator','The door opens on a young soldier in battledress, rifle slung. His face is thinner. It is Femi.'],['Femi','"Brother. Mama. Papa. Do not light the lamp. Listen. Tonight, some of us have done what had to be done. The Prime Minister, the Premiers... they are gone. By morning the whole country will know."'],['Papa','Papa sits down heavily on the bench. Nobody speaks.'],['Femi',S.ev?'"Brother, I need to ask: where is what you kept? The pages. The names. Our officers want to know who has been stealing from this country."':'"Brother, our officers are collecting names of people who knew about the contracts, the bribes, the men in the black cars. You worked at the Ministry. What do you know?"']],()=>dlg('The choice','Femi\'s eyes are red-rimmed and desperate. He is your brother. He is also a soldier of a new order.',[...(S.ev?[['Give him the pages',()=>fin2('gave')],['Burn them where you stand',()=>fin2('burned')]]:[]),['Tell him everything you know',()=>fin2('told')],['Tell him nothing and ask him to leave',()=>fin2('silent'),1],['Hide him and the family',()=>fin2('hide')]]))}
function fin2(k){S.final=k;S.f.a6_knock=1;fin('a6_knock');const T={gave:'You hand over the pages. Femi folds them into his tunic. "Thank you. You may have saved lives." Later, you will learn whose.',burned:'You hold the pages to the lamp flame and watch them curl. Femi stares, then nods slowly. "If anyone asks, I never saw them." He is leaving something behind, as you are.',told:'You tell him every name, every ledger, every figure. When you finish, he writes nothing; he has remembered all of it. "Stay home for the next week."',silent:'You say you know nothing and ask him to leave. He looks at you for a long moment. "As you wish, brother." He goes, and you cannot tell if you have betrayed him or saved yourself.',hide:'Mama bolts the door; Papa pulls the bench to the back room. Femi sits among the yams in the dark. Outside, lorries rumble past all night.'}[k];seq([['Narrator',T],['Narrator','Dawn comes up grey over the rooftops of Ibadan. The radio finally speaks, a solemn voice, military marches, then the name Aguiyi-Ironsi.']],endChapter)}
function endChapter(){S.f.ch1done=1;const L=[];L.push('Vote, Dec 1959: '+(S.voted||'none'));L.push('Ledger 17: '+(S.led||'none'));L.push('Lagos ending: '+(S.end||'none'));if(S.road)L.push('You walked the road');if(S.peek)L.push('You read the voucher');L.push('Evidence still held: '+(S.ev||0));L.push('Danger: '+(S.dan||0));L.push('Strike: '+(S.strikeChoice||'n/a'));L.push('Wedding: '+(S.wed||'none'));L.push('Iya Sade: '+(S.hid||'n/a'));L.push('Femi: '+(S.final||'n/a'));L.push('Family trust: '+(S.fam||50));L.push('Savings: '+D((S.bank2||0)));dlg('End of Chapter 1: "The First Republic"','<b>15 January 1966.</b> Nigeria\'s first coup. The Prime Minister and several leaders are dead; Prime Minister Balewa, Premiers Akintola and Ahmadu Bello and Finance Minister Okotie-Eboh are killed; Major-General Aguiyi-Ironsi takes charge the next day.<br><br><b>Your carry-forward file</b> (used in Chapter 2):<br>'+L.join('<br>')+'<br><br><i>Chapter 2 begins in 1966.</i>',[['Continue exploring Ibadan',shut,1]])}

{const _fu=folUpd;folUpd=function(dt){const sv=S.carry;if(S.carryN&&!S.carry)S.carry=1;_fu(dt);if(!sv&&S.carry&&S.carryN)S.carry=0}}

let VCACHE=null;function loadV(){try{const v=speechSynthesis.getVoices();if(!v.length)return;const rank=x=>(/en[-_]NG/i.test(x.lang)||/nigeria/i.test(x.name)?0:/en[-_](ZA|GH|KE)/i.test(x.lang)?2:/en[-_]GB/i.test(x.lang)?4:6)+(x.localService?0:3);VCACHE=v.filter(x=>/^en/i.test(x.lang)).sort((a,b)=>rank(a)-rank(b))[0]||null}catch(e){}}
